<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Hyrox Daily</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#181614" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hyrox Daily" />
<style>
  :root{
    --bg:#181614; --surface:#221f1c; --surface-2:#2a2622; --border:#37322c;
    --text:#f3efe9; --text-secondary:#a39c92; --text-tertiary:#746e65;
    --coral:#d85a30; --coral-bg:#2b1d15; --coral-text:#f0997b;
    --teal:#1d9e75; --teal-bg:#13231d; --teal-text:#5dcaa5; --gray-bg:#262320;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  body{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px);min-height:100vh;}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .app-title{font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-secondary);margin:0;}
  .date-label{font-size:13px;color:var(--text-tertiary);margin:0;}
  .goal-bar{display:flex;gap:14px;font-size:12px;color:var(--text-tertiary);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .goal-bar b{color:var(--text-secondary);font-weight:600;}
  .week-tabs{display:flex;gap:5px;margin-bottom:12px;}
  .week-tab{flex:1;padding:8px 0;text-align:center;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-secondary);}
  .week-tab.active{background:var(--surface-2);color:var(--text);border-color:#4a4338;}
  .week-meta{font-size:12px;color:var(--text-tertiary);margin-bottom:16px;line-height:1.5;}
  .day-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:18px;}
  .day-tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:10px;border:1px solid var(--border);background:var(--surface);}
  .day-tab.active{border-color:#4a4338;background:var(--surface-2);}
  .day-tab .dname{font-size:11.5px;font-weight:600;color:var(--text);}
  .day-tab .dot{width:7px;height:7px;border-radius:50%;}
  .hero{border-radius:14px;padding:14px 16px;margin-bottom:16px;}
  .hero.coral{background:var(--coral-bg);} .hero.teal{background:var(--teal-bg);} .hero.gray{background:var(--gray-bg);}
  .hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .hero-tag{font-size:12px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;margin:0 0 3px;}
  .hero.coral .hero-tag{color:var(--coral-text);} .hero.teal .hero-tag{color:var(--teal-text);} .hero.gray .hero-tag{color:var(--text-secondary);}
  .hero-title{font-size:18px;font-weight:600;margin:0;color:var(--text);}
  .hero-sub-label{font-size:11.5px;color:var(--text-tertiary);margin:0;text-align:right;}
  .hero-sub{font-size:18px;font-weight:600;margin:0;color:var(--text);text-align:right;}
  .section-label{font-size:12px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-secondary);margin:0 0 8px;}
  .section-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .cal-total{font-size:12.5px;color:var(--text-tertiary);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 15px;margin-bottom:18px;}
  .ex-item{display:flex;gap:9px;padding:7px 0;font-size:14px;line-height:1.5;}
  .ex-item:not(:first-child){border-top:1px solid var(--border);}
  .ex-dot{width:5px;height:5px;border-radius:50%;margin-top:7px;flex-shrink:0;}
  .rox{font-weight:600;}
  .meal-row{display:flex;gap:12px;}
  .meal-time-col{display:flex;flex-direction:column;align-items:center;width:56px;flex-shrink:0;}
  .meal-time{font-size:11px;color:var(--text-tertiary);white-space:nowrap;}
  .meal-node{width:8px;height:8px;border-radius:50%;margin:5px 0;background:var(--text-tertiary);flex-shrink:0;}
  .meal-node.session{width:10px;height:10px;background:var(--coral);}
  .meal-line{width:1px;flex:1;background:var(--border);min-height:16px;}
  .meal-body{padding-bottom:14px;flex:1;}
  .meal-head{display:flex;justify-content:space-between;gap:8px;}
  .meal-name{font-size:14px;font-weight:600;margin:0 0 2px;color:var(--text);}
  .meal-cal{font-size:12px;color:var(--text-tertiary);white-space:nowrap;}
  .meal-detail{font-size:13px;color:var(--text-secondary);margin:0;line-height:1.5;}
  button{font-family:inherit;}
</style>
</head>
<body>

var TAG={quality:{label:"quality / run",ramp:"coral"},strength:{label:"strength",ramp:"coral"},easy:{label:"easy run",ramp:"teal"},rest:{label:"rest day",ramp:"gray"}};
var BLOCK_START=new Date(2026,7,17); // Aug 17, 2026 - Week 1 Monday

function slotOf(time){
 if(time==="-"||time==="TBD") return "none";
 var pm=time.indexOf("PM")>-1, hr=parseInt(time);
 if(pm) return "evening";
 if(hr<=10) return "early_am";
 return "late_am";
}

function meals(tag,time,race){
 var hard=(tag==="quality"||tag==="strength");
 if(race){
  return [
   {t:"5:30 AM",n:"Pre-race breakfast",d:"Oatmeal + banana + honey, low fiber — eat ~3h before start",c:500},
   {t:"7:30 AM",n:"Final top-up",d:"Banana or rice cakes + electrolytes, ~60-90 min before",c:150},
   {t:"race",n:"Race start",d:"Fuel done — sip water/electrolytes only",c:0,s:1},
   {t:"post",n:"Post-race recovery",d:"Protein shake + banana right after the line",c:250},
   {t:"+2 hr",n:"Recovery meal",d:"Full plate: chicken or beef + rice + veg",c:700},
   {t:"Dinner",n:"Celebrate",d:"Balanced dinner, whatever you're craving",c:600}
  ];
 }
 var slot=slotOf(time), m=[];
 if(slot==="early_am"){
  m.push({t:"6:45 AM",n:"Pre-run fuel",d:"Banana + half scoop protein, or small bowl of oats",c:250});
  m.push({t:time,n:"Session",d:"Training — refuel right after",c:0,s:1});
  m.push({t:"10:30 AM",n:"Post-session brunch",d:"Oatmeal 80g + 1 scoop protein + 2 eggs scrambled with spinach + tomato",c:650});
  m.push({t:"1:30 PM",n:"Lunch",d:hard?"Chicken breast 180g over spinach, onion, tomato + rice/potato":"Chicken breast 150g over spinach, onion, tomato, light carb",c:hard?550:450});
  m.push({t:"4:00 PM",n:"Snack",d:"Protein shake + handful of nuts or fruit",c:250});
  m.push({t:"7:00 PM",n:"Dinner",d:hard?"Ground beef or chicken thigh 180g with onion, tomato, spinach + full carb":"Ground beef or chicken thigh 150g with onion, tomato, spinach + moderate carb",c:hard?650:550});
  return m;
 }
 if(slot==="late_am"){
  m.push({t:"7:00 AM",n:"Breakfast",d:"Oatmeal 80g with 1 scoop protein, 2 eggs scrambled with spinach + tomato",c:550});
  m.push({t:"9:30 AM",n:"Pre-session snack",d:"Small bowl of oats or banana + half scoop protein",c:200});
  m.push({t:time,n:"Session",d:"Training — lunch shifts to right after",c:0,s:1});
  m.push({t:"1:00 PM",n:"Post-session lunch",d:hard?"Chicken breast 180g over spinach, onion, tomato + rice/potato + protein shake":"Chicken breast 150g over spinach, onion, tomato, light carb",c:hard?700:450});
  m.push({t:"3:30 PM",n:"Snack",d:"Protein shake + handful of nuts or fruit",c:250});
  m.push({t:"7:30 PM",n:"Dinner",d:"Ground beef or chicken thigh 160g with onion, tomato, spinach + moderate carb",c:hard?600:550});
  return m;
 }
 if(slot==="evening"){
  m.push({t:"7:00 AM",n:"Breakfast",d:"Oatmeal 80g with 1 scoop protein, 2 eggs scrambled with spinach + tomato",c:550});
  m.push({t:"12:30 PM",n:"Lunch",d:hard?"Chicken breast 180g over spinach, onion, tomato + rice/potato":"Chicken breast 150g over spinach, onion, tomato, light carb",c:hard?600:450});
  m.push({t:"3:30 PM",n:"Snack",d:"Protein shake + handful of nuts or fruit",c:250});
  m.push({t:"5:30 PM",n:"Pre-session snack",d:"Light carb — rice cakes, banana, or small oats",c:150});
  m.push({t:time,n:"Session",d:"Training block",c:0,s:1});
  m.push({t:"8:00 PM",n:"Dinner",d:hard?"Ground beef or chicken thigh 180g with onion, tomato, spinach + full carb":"Ground beef or chicken thigh 150g with onion, tomato, spinach + moderate carb",c:hard?650:550});
  return m;
 }
 m.push({t:"7:30 AM",n:"Breakfast",d:"Oatmeal 60g with 1 scoop protein, 2 eggs scrambled with spinach + tomato",c:500});
 m.push({t:"12:30 PM",n:"Lunch",d:"Chicken breast 150g over spinach, onion, tomato, light carb",c:450});
 m.push({t:"3:30 PM",n:"Snack",d:"Protein shake + handful of nuts",c:250});
 m.push({t:"7:00 PM",n:"Dinner",d:"Ground beef or chicken thigh 150g with onion, tomato, spinach + moderate carb",c:550});
 return m;
}

function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function computeDefault(){
 var t=startOfDay(new Date()), s=startOfDay(BLOCK_START);
 var diff=Math.round((t-s)/86400000);
 if(diff<0) return {w:0,d:0};
 var tw=Math.floor(diff/7); if(tw>6) tw=6;
 return {w:tw, d:diff%7};
}

var def=computeDefault();
var wi=def.w, di=def.d;

var wtEl=document.getElementById('week-tabs'),wmEl=document.getElementById('week-meta'),dtEl=document.getElementById('day-tabs'),dcEl=document.getElementById('day-content'),dlEl=document.getElementById('date-label');

function dotColor(r){return r==='gray'?'var(--text-tertiary)':(r==='teal'?'var(--teal)':'var(--coral)');}

function renderWeeks(){
 var h='';
 for(var i=0;i<7;i++){h+='<button class="week-tab'+(i===wi?' active':'')+'" data-i="'+i+'">W'+(i+1)+'</button>';}
 wtEl.innerHTML=h;
 Array.prototype.forEach.call(wtEl.querySelectorAll('.week-tab'),function(el){el.onclick=function(){wi=+el.dataset.i;di=0;renderAll();};});
}
function renderDays(){
 var wk=PLAN[wi],h='';
 wk.days.forEach(function(d,i){
  var r=ramp(d.tag);
  h+='<button class="day-tab'+(i===di?' active':'')+'" data-i="'+i+'"><span class="dname">'+d.day+'</span><span class="dot" style="background:'+dotColor(r)+'"></span></button>';
 });
 dtEl.innerHTML=h;
 Array.prototype.forEach.call(dtEl.querySelectorAll('.day-tab'),function(el){el.onclick=function(){di=+el.dataset.i;renderDays();renderContent();};});
}

 var wk=PLAN[wi],d=wk.days[di],r=ramp(d.tag),ml=meals(d.tag,d.time,d.race),tot=ml.reduce(function(s,x){return s+x.c;},0);
 var h='';
 h+='<div class="hero '+r+'"><div class="hero-row">'
  +'<div><p class="hero-tag">'+TAG[d.tag].label+'</p><p class="hero-title">'+d.title+'</p></div>'

  +'</div></div>';
 h+='<p class="section-label">workout <span style="color:var(--text-tertiary);font-weight:400;text-transform:none;letter-spacing:0;">&middot; '+d.time+'</span></p>';

 d.items.forEach(function(it){

  h+='<div class="ex-item"><span class="ex-dot" style="background:'+(isRox?'var(--coral)':'var(--text-tertiary)')+'"></span><span'+(isRox?' class="rox"':'')+'>'+it+'</span></div>';
 });
 h+='</div>';
 h+='<div class="section-row"><p class="section-label" style="margin:0;">'+(d.race?'race-day fueling':'eating schedule')+'</p><span class="cal-total">~'+tot+' kcal</span></div>';
 h+='<div>';
 ml.forEach(function(m,i){
  var last=i===ml.length-1;
  if(m.s){
   h+='<div class="meal-row"><div class="meal-time-col"><span class="meal-time">'+m.t+'</span><span class="meal-node session"></span>'+(last?'':'<div class="meal-line"></div>')+'</div><div class="meal-body"><p class="meal-name">&#9889; '+m.n+'</p><p class="meal-detail">'+m.d+'</p></div></div>';
   return;
  }
  h+='<div class="meal-row"><div class="meal-time-col"><span class="meal-time">'+m.t+'</span><span class="meal-node"></span>'+(last?'':'<div class="meal-line"></div>')+'</div><div class="meal-body"><div class="meal-head"><p class="meal-name">'+m.n+'</p><span class="meal-cal">'+m.c+' kcal</span></div><p class="meal-detail">'+m.d+'</p></div></div>';
 });
 h+='</div>';
 dcEl.innerHTML=h;
}
function renderAll(){
 var wk=PLAN[wi];
 wmEl.textContent=wk.load+' \u00b7 '+wk.mileage+' km target \u00b7 '+wk.focus.toLowerCase();
 renderWeeks();renderDays();renderContent();
}
function renderDate(){dlEl.textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}

renderDate();renderAll();

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
